name: CI

# 持续集成：每次提交自动验证"这份工程还能跑、指标口径没被改坏"。
# 设计说明：
#   * core 作业**不安装 TensorFlow**（约 200MB），因此能在 1~2 分钟内跑完，
#     覆盖数据生成器、数据管线、滑窗、评估口径与演示接口；
#   * full 作业安装 TensorFlow，跑一次 --smoke 端到端（训练 + 评估 + 出图）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: 数据链路与单元测试（不依赖 TensorFlow）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装核心依赖（不含 TensorFlow）
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.1.4 scikit-learn==1.4.2 scipy \
                      matplotlib==3.8.4 seaborn==0.13.2 joblib==1.3.2 flask==3.0.3
      - name: 环境自检
        run: python tools/check_env.py || true   # 缺 TF 属预期，不视为失败
      - name: 语法与导入检查（全部模块与工具，避免坏文件被合并）
        run: |
          python -m compileall -q src app tools tests integrations run_all.py
          python -c "from src.service import DetectorConfig; c=DetectorConfig.from_env(); print('策略默认值:', c)"
      - name: 处置策略的环境变量配置（部署路径）可用
        env:
          CIDA_POLICY_ACTION: block
          CIDA_DRY_RUN: "0"
          CIDA_CONFIRM_WINDOWS: "5"
          CIDA_WHITELIST: "10.0.0.1 10.0.0.254"
        run: |
          python -c "from src.service import DetectorConfig; c=DetectorConfig.from_env(); \
          assert c.action=='block' and c.dry_run is False and c.confirm_windows==5, c; print('OK', c)"
          # 非法动作必须被拒绝并回退，不能让错误动作进入处置链路
          python -c "import os; from src.service import DetectorConfig; \
          os.environ['CIDA_POLICY_ACTION']='nuke'; assert DetectorConfig.from_env().action=='observe'; print('OK 非法动作已回退')"
      - name: 单元测试（缺 TensorFlow 的用例自动跳过并计数）
        env:
          CIDA_NO_TF: "1"      # 本作业不装 TF：走跳过路径，汇总行会打印「通过 X / 跳过 N」
        run: python tests/test_core.py
      - name: Ryu 适配层行为测试（桩件替代 Ryu：接口契约 + 安全默认值 + 下发路径）
        run: python tests/test_ryu_guard.py
      - name: 特征选择算法自检（bPLO/PSO 在已知答案的合成问题上，不依赖 TF）
        run: python tools/feature_selection.py --self-test
      - name: OF1.3 编解码自检（真实 Ryu 联调工具的离线部分，不依赖 ryu）
        run: python tools/ryu_live_check.py --self-test
      - name: 无 TF 全链路自检（数据生成 → 评估 → 出图）
        run: python tools/smoke_test.py --scale 0.08

  full:
    # 附加验证：core 作业是门禁；本作业装 TensorFlow 跑端到端快跑，
    # 上游 wheel/版本波动不应让整个仓库显示红叉，因此标为「失败不影响 CI 结论」。
    name: 附加：端到端快跑（含 TensorFlow；失败不影响 CI 结论）
    runs-on: ubuntu-latest
    needs: core
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tf-${{ hashFiles('requirements.txt') }}
      - name: 安装依赖（显式清单；仅用二进制 wheel，避免在 CI 上编译源码）
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: numpy==1.26.4 pandas==2.1.4 scikit-learn==1.4.2 \
                      scipy joblib==1.3.2 matplotlib==3.8.4 seaborn==0.13.2 flask==3.0.3
          pip install --only-binary=:all: "tensorflow-cpu==2.15.*" "keras==2.15.*"
      - name: 单元测试（完整：含需要 TensorFlow 的服务与对抗用例）
        run: python tests/test_core.py
      - name: 端到端快跑（独立目录，不污染正式结果）
        run: python run_all.py --smoke
      - name: 上传图表与报告
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            results/_smoke/
            results/summary_cnn_bilstm_smoke.md
          if-no-files-found: warn
