# =============================================================================
#  CIDA 检测服务反向代理样例
#  用途：把检测服务安全地暴露给管理网；/metrics 只给监控机。
#  安装：
#     sudo cp deploy/nginx-cida.conf /etc/nginx/conf.d/cida.conf
#     sudo htpasswd -c /etc/nginx/.htpasswd cida-admin
#     sudo nginx -t && sudo systemctl reload nginx
#  改完记得把下面的 10.0.0.0/8 换成你自己的管理网段。
# =============================================================================

upstream cida_detect {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name cida-detect.internal;      # 内网域名或管理 IP

    # 允许访问的来源：只放管理网段与监控机，其余一律拒绝
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    client_max_body_size 8m;               # /api/detect 的批量流记录上限
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ---- 演示大屏 + 检测接口：需要认证 ----
    location / {
        auth_basic           "CIDA SDN IDS";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://cida_detect;
        # 检测接口可能一次推较多流记录，读超时给足
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Prometheus 指标：只允许监控机抓取，且不做 Basic 认证（抓取端不便维护口令）----
    location = /metrics {
        allow 10.0.0.9;                    # ← 改成你的监控机地址（可写多条 allow）
        deny  all;
        access_log off;
        proxy_pass http://cida_detect;
    }

    # ---- 健康检查：给负载均衡/探活用，不含敏感信息 ----
    location = /api/health {
        access_log off;
        proxy_pass http://cida_detect;
    }

    # ---- 告警审计台账接口：只给管理网，避免暴露内网 IP 拓扑 ----
    location /api/alerts {
        auth_basic           "CIDA SDN IDS";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://cida_detect;
    }
}
